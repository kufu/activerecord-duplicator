name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  test-postgresql:
    runs-on: ubuntu-latest
    name: PostgreSQL / Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    # YAML anchor: identical matrix is aliased from test-sqlite3 below.
    strategy: &spec_strategy
      fail-fast: false
      matrix:
        ruby:
          - '3.3'
          - '3.4'
        rails:
          - '8.0'
          - '8.1'

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: activerecord_duplicator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails }}.gemfile
      ARCONN: postgresql
      DATABASE_URL: postgres://postgres:password@localhost:5432/activerecord_duplicator_test

    # YAML anchor: identical step list is aliased from test-sqlite3 below so
    # the two adapter jobs share one steps block. Only env / services differ.
    steps: &spec_steps
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@6e5d382445ae5590b7449d8b3bc8cb1c2c27f617 # v1.317.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run specs
        run: bundle exec rspec

  test-sqlite3:
    runs-on: ubuntu-latest
    name: SQLite3 / Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    strategy: *spec_strategy

    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails }}.gemfile
      ARCONN: sqlite3

    steps: *spec_steps

  # RuboCop output is independent of the Ruby / Rails / adapter axes, so it
  # runs once against the newest supported Ruby instead of on every matrix
  # cell.
  rubocop:
    runs-on: ubuntu-latest
    name: RuboCop
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@6e5d382445ae5590b7449d8b3bc8cb1c2c27f617 # v1.317.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop

  rbs:
    runs-on: ubuntu-latest
    name: RBS drift check
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@6e5d382445ae5590b7449d8b3bc8cb1c2c27f617 # v1.317.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Regenerate sig/generated from rbs-inline
        run: bundle exec rake rbs:inline
      - name: Verify sig/generated is up to date
        run: git diff --exit-code sig/
