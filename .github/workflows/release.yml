name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: rubygems.org
      url: https://rubygems.org/gems/activerecord-duplicator

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      # Trusted Publisher must be configured for this repo at
      # https://rubygems.org/gems/activerecord-duplicator/trusted_publishers
      # before this action can push.
      - name: Publish gem to RubyGems.org
        uses: rubygems/release-gem@v1
