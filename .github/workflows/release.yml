name: Push to rubygems.org

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@v1.317.0
        with:
          ruby-version: '3.4'
          rubygems: latest
          bundler-cache: true
      - uses: rubygems/release-gem@v1.4.0
